name: Bug report
description: Something in tvcask is broken or behaving unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Having trouble logging in, or with your account? Please email
        **tvcask@protonmail.com** instead. That way you can include the address you
        signed up with and we can look it up straight away. Issues here are public,
        so never post an email address, password, or token.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where did this happen?
      options:
        - Web (tvcask.com)
        - iOS app
        - Both
    validations:
      required: true

  - type: input
    id: when
    attributes:
      label: Roughly when?
      description: Date and rough time, with your timezone. Helps us match it against server logs.
      placeholder: 26 Jul, around 09:00 CEST

  - type: input
    id: environment
    attributes:
      label: Browser or device
      placeholder: Firefox 141 on Windows 11, or iPhone 15 on iOS 18.2
